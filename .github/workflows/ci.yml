name: VitalSync CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Install ESLint
        working-directory: ./backend
        run: npm install --save-dev eslint @eslint/js

      - name: Create ESLint config
        working-directory: ./backend
        run: |
          cat > eslint.config.js << 'ESLINT'
          import js from "@eslint/js";
          export default [
            js.configs.recommended,
            {
              languageOptions: {
                globals: {
                  require: "readonly",
                  console: "readonly",
                  process: "readonly"
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-console": "off"
              }
            }
          ];
          ESLINT

      - name: Run ESLint
        working-directory: ./backend
        run: npx eslint server.js

      - name: Run Jest tests
        working-directory: ./backend
        run: npm test

build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/vitalsync-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/vitalsync-frontend:${{ github.sha }}

deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << 'ENVEOF'
          POSTGRES_HOST=database
          POSTGRES_DB=vitalsync
          POSTGRES_USER=vitalsync_user
          POSTGRES_PASSWORD=vitalsync_pass
          ENVEOF

      - name: Deploy with Docker Compose
        run: docker compose up -d --build

      - name: Wait for backend to be ready
        run: sleep 10

      - name: Health check
        run: |
          curl --fail http://localhost:3000/health || exit 1

      - name: Tear down
        if: always()
        run: docker compose down